[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-investigation-rag"
version = "0.1.0"
description = "Local Windows PyQt5 investigation-folder RAG and search app using SQLite, LanceDB, and Ollama."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyQt5>=5.15",
  "lancedb>=0.12",
  "pyarrow>=15",
  "pandas>=2",
  "numpy>=1.24",
  "scikit-learn>=1.4",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "extract-msg>=0.48",
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
entities = [
  "gliner",
]

[project.scripts]
investigation-rag = "investigation_rag.cli:main"
investigation-rag-gui = "investigation_rag.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
investigation_rag = ["db/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
